name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: backend
        run: pnpm run lint

      - name: Test
        working-directory: backend
        run: pnpm test

      - name: Build
        working-directory: backend
        run: pnpm run build

      # A green build that produces an unbuildable image is not green.
      - name: Build container image
        working-directory: backend
        run: docker build -t updatenotify-backend:ci .
