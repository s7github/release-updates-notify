# --- JVM ---
# 4g suits CI runners and most laptops. Raise locally if you have the headroom.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# --- Build performance ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# --- Kotlin ---
kotlin.code.style=official
kotlin.incremental=true

# --- Android ---
# AGP 9 ships built-in Kotlin support and a new DSL, both enabled by default.
# KSP is not yet compatible with built-in Kotlin, and Room and Hilt both require
# KSP, so we opt out of both and apply org.jetbrains.kotlin.android explicitly.
# This is the transition path AGP documents. Revisit once KSP supports built-in
# Kotlin; until then these two flags are load-bearing.
# See https://kotl.in/gradle/agp-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# Fail the build if a dependency drags in a duplicate class rather than
# silently picking one.
android.enableJetifier=false

# --- KSP ---
ksp.incremental=true
